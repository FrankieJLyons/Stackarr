name: Real Docker integration lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - name: Enable the OCI image store on this disposable runner
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Load reviewed bundled app image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'Stackarr-0.1.0-Windows-x64.zip*' --dir "$RUNNER_TEMP/beta"
          python -m tools.prepare_ci_bundled "$RUNNER_TEMP/beta/Stackarr-0.1.0-Windows-x64.zip" "$RUNNER_TEMP/beta/Stackarr-0.1.0-Windows-x64.zip.sha256"
      - run: docker build --tag stackarr:ci .
      - run: python -m tools.docker_lab_ci --context "$(docker context show)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab-redacted-evidence
          retention-days: 7
          path: |
            test-results/docker-lab/*/api-report.json
            test-results/docker-lab/*/wiring-report.json
  install-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Free unused SDK space for the real storage preflight
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock playwright==1.63.0
      - name: Enable the OCI image store on this disposable runner
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Load reviewed bundled app image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'Stackarr-0.1.0-Windows-x64.zip*' --dir "$RUNNER_TEMP/beta"
          python -m tools.prepare_ci_bundled "$RUNNER_TEMP/beta/Stackarr-0.1.0-Windows-x64.zip" "$RUNNER_TEMP/beta/Stackarr-0.1.0-Windows-x64.zip.sha256"
      - run: python -m playwright install --with-deps chromium
      - run: python -m tools.install_wizard_check --full --plex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-wizard-redacted-evidence
          retention-days: 7
          path: |
            test-results/wizard-install-*/report.json
            test-results/wizard-install-*/installed.png
            test-results/wizard-install-*/connections.png
            test-results/wizard-install-*/installation-check.png
            test-results/wizard-install-*/lifecycle.png
            test-results/wizard-install-*/failure.png
